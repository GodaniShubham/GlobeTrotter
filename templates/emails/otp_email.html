<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  /* Mobile-first approach: inline styles are for mobile, these styles scale UP for desktop */
  @media only screen and (min-width: 481px) {
    .email-container { padding: 40px 20px !important; }
    .email-card { padding: 40px !important; }
    .brand-logo { font-size: 20px !important; }
    .otp-box { font-size: 32px !important; letter-spacing: 8px !important; padding: 20px !important; }
    .title-text { font-size: 20px !important; }
    .body-text { font-size: 15px !important; }
  }
</style>
</head>
<body style="margin: 0; padding: 0; background-color: #FBFBFC; -webkit-font-smoothing: antialiased; width: 100%;">
  <div class="email-container" style="font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px 10px; background-color: #FBFBFC; box-sizing: border-box; width: 100%;">
      <div class="email-card" style="background: white; border-radius: 12px; padding: 24px 15px; border: 1px solid #F0F0F1; box-shadow: 0 4px 24px rgba(0,0,0,0.02); box-sizing: border-box; width: 100%;">
          <div style="text-align: center; margin-bottom: 24px;">
              <span class="brand-logo" style="font-size: 18px; font-weight: bold; color: #222;">
                  GlobeTrotter <span style="color: #D0CDCF; margin: 0 4px;">×</span> <span style="color: #714B67;">o</span>doo
              </span>
          </div>
          <h2 class="title-text" style="margin-top: 0; color: #222; font-size: 18px; text-align: center;">Your verification code</h2>
          <p class="body-text" style="color: #444; font-size: 14px; line-height: 1.5; text-align: center; margin-bottom: 24px; word-break: break-word;">
              Enter the 6-digit code below to securely verify your identity and reset your password.
          </p>
          <div class="otp-box" style="background-color: #FBFBFC; border: 1px dashed #D3D1D5; border-radius: 8px; padding: 15px; text-align: center; margin-bottom: 24px; box-sizing: border-box; width: 100%;">
              <span style="font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 24px; font-weight: bold; letter-spacing: 4px; color: #714B67;">{{ otp }}</span>
          </div>
          <p style="color: #777981; font-size: 12px; line-height: 1.5; text-align: center; margin: 0; word-break: break-word;">
              If you didn't request a password reset, you can safely ignore this email.
          </p>
      </div>
      <div style="text-align: center; margin-top: 24px;">
          <p style="color: #A0A1A7; font-size: 12px; margin: 0;">© {% now "Y" %} GlobeTrotter Workspace.</p>
      </div>
  </div>
</body>
</html>
