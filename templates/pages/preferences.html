{% extends 'base.html' %}
{% block crumb %}Preferences{% endblock %}
{% block content %}
<div class="page-header"><div><div class="kicker">PROFILE</div><h1 class="page-title">Preferences</h1><p class="page-subtitle">Tell GlobeTrotter how you like to travel so the workspace can stay in your rhythm.</p></div><div class="actions"><a class="btn btn-secondary" href="/profile/">Back to profile</a><button class="btn btn-primary" data-toast="Preferences saved">Save changes</button></div></div>
<div class="settings-grid">
  <section class="panel panel-pad"><div class="kicker">TRAVEL STYLE</div><h3>How do you like to move?</h3><div class="preference-options"><button class="preference-option active"><strong>Balanced</strong><span>A mix of highlights and breathing room.</span></button><button class="preference-option"><strong>Slow</strong><span>Fewer stops, longer stays, more open time.</span></button><button class="preference-option"><strong>Fast</strong><span>Make the most of every available day.</span></button></div></section>
  <section class="panel panel-pad"><div class="kicker">DEFAULTS</div><div class="form-grid"><div class="field"><label>Currency</label><select><option>INR — ₹</option><option>USD — $</option><option>EUR — €</option></select></div><div class="field"><label>Language</label><select><option>English</option><option>Hindi</option></select></div><div class="field"><label>Typical trip length</label><select><option>5–8 days</option><option>2–4 days</option><option>9–14 days</option></select></div><div class="field"><label>Preferred planning style</label><select><option>Detailed</option><option>Flexible</option><option>Minimal</option></select></div></div></section>
  <section class="panel panel-pad"><div class="kicker">INTERESTS</div><div class="tag-row settings-tags"><button class="filter-chip active">Food</button><button class="filter-chip active">Culture</button><button class="filter-chip active">Nature</button><button class="filter-chip">Adventure</button><button class="filter-chip">Design</button><button class="filter-chip">Nightlife</button><button class="filter-chip">Shopping</button><button class="filter-chip">Wellness</button></div></section>
</div>
{% endblock %}
