<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}GlobeTrotter{% endblock %}</title>
    <!-- Tailwind CSS (CDN for rapid prototyping, replace with build step later) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#714B67',
                        dark: '#2F2930',
                        accent: '#F6B73C',
                        surface: '#FFFFFF',
                        background: '#F7F7F7',
                    }
                }
            }
        }
    </script>
    {% block extra_css %}{% endblock %}
</head>
<body class="bg-background text-dark font-sans antialiased">

    <!-- Navigation -->
    <nav class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex">
                    <div class="flex-shrink-0 flex items-center">
                        <a href="/" class="text-2xl font-bold text-primary">GlobeTrotter</a>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    {% if user.is_authenticated %}
                        <a href="#" class="text-gray-600 hover:text-primary">Dashboard</a>
                        <a href="#" class="text-gray-600 hover:text-primary">Profile</a>
                        <form method="post" action="{% url 'logout' %}" class="inline">
                            {% csrf_token %}
                            <button type="submit" class="text-gray-600 hover:text-primary">Logout</button>
                        </form>
                    {% else %}
                        <a href="#" class="text-gray-600 hover:text-primary">Login</a>
                        <a href="#" class="bg-primary text-white px-4 py-2 rounded-md hover:bg-opacity-90">Sign Up</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}
        {% endblock %}
    </main>

    {% block extra_js %}{% endblock %}
</body>
</html>
